# The multi-node shape, on CoreWeave. Same measurement as `job.yaml`, different cluster
# facts: one pod per node with a single GPU each, so `ep_size = NODES` and every destination
# the router picks is a different host. That is the only shape in which the fan-out this
# kernel removes is charged over RDMA rather than NVLink - see the tier note in launch.sh.
#
# What differs from the OpenShift template, and why:
#   - `rdma/ib`, not `rdma/roce_gdr`. CoreWeave's nodes advertise 64 IB devices each.
#   - One volume, not five. The results claim carries the code *and* the weights, because
#     there are no pre-populated model PVCs here; `placement-stage` downloads into it once.
#   - No HF token. `serve_run.py` benchmarks on synthetic token ids and the checkpoint is
#     ungated, so nothing reaches the Hub from inside the job.
#   - No TF4 venv: that cluster fact does not apply here. `BAD` names a different host.
apiVersion: batch/v1
kind: Job
metadata:
  name: placement-${NAME}
  namespace: ${NS}
  labels: {app: placement-router, owner: almogtavor}
spec:
  backoffLimit: 6
  # One pod per node, and the anti-affinity is what makes "per node" true - four pods packed
  # onto one host would be the single-node case under a different name, which is precisely
  # the case that has already been measured and shows nothing.
  completions: ${NODES}
  parallelism: ${NODES}
  completionMode: Indexed
  template:
    metadata:
      labels: {app: placement-router, owner: almogtavor, job: placement-${NAME}}
    spec:
      restartPolicy: Never
      subdomain: placement-${NAME}
      affinity:
        # `gd91fda` is Ready but its kubelet cannot create a pod sandbox at all:
        # `/var/lib/cni/results` is out of space, so every attempt fails identically and the
        # pod sits in ContainerCreating forever. One faulted host out of five is the difference
        # between a 4-node run and no run, so the exclusion is the launch arg.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [${BAD}]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {job: placement-${NAME}}}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: run
        image: vllm/vllm-openai:${IMG}
        command: [/bin/bash, -lc]
        args:
        - |
          set -xeuo pipefail
          cd /results/placement-router
          export PY=python3
          exec bash experiments/run.sh
        env:
        - {name: USER, value: vllm}
        - {name: LOGNAME, value: vllm}
        - {name: HOME, value: /tmp}
        - {name: HF_HOME, value: /tmp/hf}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: TRITON_CACHE_DIR, value: /tmp/triton}
        - {name: VLLM_CACHE_ROOT, value: /tmp/vllm}
        - {name: TF4, value: "0"}
        - {name: ARMS, value: "${ARMS}"}
        - {name: REPS, value: "${REPS}"}
        - {name: REP0, value: "${REP0}"}
        - {name: A2A, value: "${A2A}"}
        - {name: SERVE, value: "${SERVE}"}
        - {name: DP, value: "${DP}"}
        - {name: NODES, value: "${NODES}"}
        - {name: HEAD, value: "placement-${NAME}-0.placement-${NAME}.${NS}.svc.cluster.local"}
        - {name: MODEL, value: "${MODEL}"}
        - {name: TAG, value: "${TAG}"}
        - {name: GPUS, value: "${GPUS}"}
        - {name: N_REQ, value: "${N_REQ}"}
        - {name: PROMPT_LEN, value: "${PROMPT_LEN}"}
        - {name: GEN_LEN, value: "${GEN_LEN}"}
        # The scheduler's per-step token budget, which is the dispatch payload per
        # all-to-all. Under data parallelism vLLM defaults it to 256, not 2048, so without
        # this every long prompt arrived as 256-token chunks and `V` stayed small however
        # many requests were in flight. It is a measurement condition, so it is passed.
        - {name: BATCH_TOK, value: "${BATCH_TOK}"}
        - {name: REPEATS, value: "${REPEATS}"}
        # Internode DeepEP dispatches through NVSHMEM over IB, which is off by default: the
        # intra-node runs never needed it because they never left the host. IBGDA is what lets
        # the GPU post sends without a CPU proxy, which is the path DeepEP's throughput
        # numbers assume.
        - {name: NVSHMEM_IB_ENABLE_IBGDA, value: "${IBGDA}"}
        - {name: NVSHMEM_IBGDA_NIC_HANDLER, value: "${NIC_HANDLER}"}
        - {name: NVSHMEM_DEBUG, value: "${NVSHMEM_DEBUG}"}
        - {name: NCCL_IB_DISABLE, value: "0"}
        # nixl_ep registers its EP buffers through UCX's *device* (GPU-initiated) API, and
        # with UCX's default transport set one of the memory domains it picks has no device-API
        # support: registration dies in `ucp_device.c` with `invalid memh for md_index=6` ->
        # `failed to create local mem list handle: Invalid parameter`. Naming the transports
        # explicitly drops that domain and local registration succeeds. `cuda_ipc` is absent
        # deliberately and useless here anyway - no two ranks share a host.
        # `tcp` is in that list because the NIXL agents exchange their metadata over it: without
        # it `loadRemoteMD` returns -3 ("Failed to get metadata for remote agent N") on every
        # rank. Dropping `tcp` and pinning the IB device instead was tried and reproduced the
        # same -3, which also rules device mismatch out as its cause.
        - {name: UCX_TLS, value: "rc_mlx5,cuda_copy,tcp,self"}
        # `UCX_NET_DEVICES` is deliberately absent: every pod sees all 17 of its host's IB
        # devices ACTIVE while the RDMA resource grants one, and the device to pin depends on
        # which of the eight GPUs this rank was handed, so run.sh resolves it per pod. Still
        # open past this point: `prepMemView` on the *remote* descriptors, nixl_ep.cpp:1350,
        # two lines after the local one passes.
        resources:
          limits: {cpu: "16", memory: ${MEM}, nvidia.com/gpu: "${GPUS}", rdma/ib: "1"}
          # A 2-core request, not 4. These hosts are shared and one of the five has 97% of its
          # CPU already requested while two GPUs sit free; a 4-core request is the difference
          # between four schedulable nodes and three. The limit stays high - that is the ceiling
          # the engine actually uses, and limits may overcommit where requests may not.
          requests: {cpu: "2", memory: ${MEM}, nvidia.com/gpu: "${GPUS}", rdma/ib: "1"}
        # IBGDA needs to pin and register memory for the NIC, which is privileged work.
        securityContext:
          capabilities: {add: [IPC_LOCK]}
        volumeMounts:
        - {mountPath: /results, name: results}
        - {mountPath: /dev/shm, name: dshm}
      volumes:
      - {name: results, persistentVolumeClaim: {claimName: ${CLAIM}}}
      - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
---
# Headless and publishing before readiness: the peers resolve rank 0 while every pod is still
# booting, so a Service that waited for readiness would deadlock the Job.
apiVersion: v1
kind: Service
metadata:
  name: placement-${NAME}
  namespace: ${NS}
  labels: {app: placement-router, owner: almogtavor}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {job: placement-${NAME}}
  ports: [{name: rpc, port: 5555}]
