# One Job per model, `GPUS` GPUs, one container. Substitute and apply through
# `launch.sh`, which is the only intended entrypoint.
#
# Only the BF16 checkpoints this experiment uses are mounted. `/results` holds a copy of this
# repository and carries the cached token streams in and the `runs/` artefacts out, so the
# tables can be built from a laptop after the jobs have finished. The claim and secret names
# below are placeholders: rename them to your cluster's.
apiVersion: batch/v1
kind: Job
metadata:
  name: placement-${NAME}
  labels: {app: placement-router}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app: placement-router, job: placement-${NAME}}
    spec:
      restartPolicy: Never
      # Optional `NODE=<hostname>` pin. The packing scheduler is deterministic, so a node whose
      # GPU has fallen off the bus keeps being chosen and every retry fails the same way; the
      # pin is the escape hatch. Empty renders as `{}`, which means "anywhere".
      nodeSelector: {${NODE}}
      containers:
      - name: run
        image: vllm/vllm-openai:${IMG}
        command: [/bin/bash, -lc]
        args:
        - |
          set -xeuo pipefail
          cd /results/placement-router
          # Through bash rather than by the shebang: the PVC does not always carry the
          # execute bit across a sync.
          exec bash experiments/run.sh
        env:
        # OpenShift runs with a uid absent from /etc/passwd; torch's cache-dir lookup calls
        # getpass.getuser() and dies without these.
        - {name: USER, value: vllm}
        - {name: LOGNAME, value: vllm}
        - {name: HOME, value: /tmp}
        - {name: HF_HOME, value: /tmp/hf}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: TRITON_CACHE_DIR, value: /tmp/triton}
        - {name: VLLM_CACHE_ROOT, value: /tmp/vllm}
        # Non-empty switches run.sh to the vLLM path: one engine per listed setting, in order.
        - {name: SETTINGS, value: "${SETTINGS}"}
        - {name: SCRIPT, value: "${SCRIPT}"}
        # load_penalty values the in-engine probe scores each keep at.
        - {name: PENS, value: "${PENS}"}
        - {name: REPS, value: "${REPS}"}
        - {name: REP0, value: "${REP0}"}
        # The all-to-all backend. Empty leaves vLLM's default (`allgather_reducescatter`),
        # whose dispatch volume is independent of per-token rank fan-out and therefore has
        # nothing for this kernel to save.
        - {name: A2A, value: "${A2A}"}
        - {name: DP, value: "${DP}"}
        - {name: MODEL, value: "${MODEL}"}
        - {name: TAG, value: "${TAG}"}
        - {name: GPUS, value: "${GPUS}"}
        - {name: BATCH, value: "${BATCH}"}
        - {name: NWIN, value: "${NWIN}"}
        - {name: KEEPS, value: "${KEEPS}"}
        - {name: STREAM, value: "${STREAM}"}
        - {name: TOKREF, value: "${TOKREF}"}
        # The load shape. The defaults are prefill-heavy (1024/128 at 256-way), where the
        # expert GEMMs amortise the all-to-all and a per-token fan-out saving cannot show;
        # a decode-dominant shape at modest concurrency is where the rule is supposed to pay.
        - {name: N_REQ, value: "${N_REQ}"}
        - {name: PROMPT_LEN, value: "${PROMPT_LEN}"}
        - {name: GEN_LEN, value: "${GEN_LEN}"}
        # The scheduler's per-step token budget, which is the dispatch payload per
        # all-to-all. Under data parallelism vLLM defaults it to 256, not 2048, so without
        # this every long prompt arrived as 256-token chunks and `V` stayed small however
        # many requests were in flight. It is a measurement condition, so it is passed.
        - {name: BATCH_TOK, value: "${BATCH_TOK}"}
        - {name: REPEATS, value: "${REPEATS}"}
        # Untimed repeats before the timed ones; EPLB needs them to rebalance in a short run.
        - {name: WARMUP, value: "${WARMUP}"}
        - {name: EPLB_STEPS, value: "${EPLB_STEPS}"}
        - {name: EPLB_REDUNDANT, value: "${EPLB_REDUNDANT}"}
        # evalrun.py's lm-eval tasks, and chat prompts for instruction-tuned checkpoints
        # (EVAL_CHAT for evalrun.py, CHAT for nllserve.py).
        - {name: EVAL_TASKS, value: "${EVAL_TASKS}"}
        - {name: EVAL_CHAT, value: "${EVAL_CHAT}"}
        - {name: CHAT, value: "${CHAT}"}
        # vLLM profiles memory per DP rank, and rank 0 carries the extra buffers;
        # it then sizes every rank's KV cache from its own reading, so a 0.9 that
        # fits rank 0 can overcommit rank 1 by a few hundred MiB and OOM it.
        - {name: GPU_UTIL, value: "${GPU_UTIL}"}
        # For any Hub pull; an anonymous one is rate-limited.
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}
        resources:
          limits: {cpu: "32", memory: ${MEM}, nvidia.com/gpu: "${GPUS}"}
          requests: {cpu: "8", memory: ${MEM}, nvidia.com/gpu: "${GPUS}"}
        volumeMounts:
        - {mountPath: /models/qwen_tok, name: q30rh-bf16, readOnly: true}
        - {mountPath: /models/bf16, name: q30rh-bf16, readOnly: true}
        - {mountPath: /models/q35_bf16, name: q35-bf16, readOnly: true}
        - {mountPath: /models/gm_bf16, name: gm-bf16, readOnly: true}
        - {mountPath: /results, name: results}
        - {mountPath: /dev/shm, name: dshm}
      volumes:
      - {name: q30rh-bf16, persistentVolumeClaim: {claimName: qwen3-30b-a3b-instruct-2507}}
      - {name: q35-bf16, persistentVolumeClaim: {claimName: qwen3.5-35b-a3b}}
      - {name: gm-bf16, persistentVolumeClaim: {claimName: gemma-4-26b-a4b-it}}
      - {name: results, persistentVolumeClaim: {claimName: placement-router-results}}
      # NCCL's intra-node transports need shared memory well beyond the default 64 MB.
      - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
