image:
  repository: ghcr.io/almogtavor/placement-router-vllm
  tag: v0.31.0
  pullPolicy: IfNotPresent

model: Qwen/Qwen3-30B-A3B

# How many of the top-k picks are chosen by score; the rest are replaced. Empty string is
# default vLLM routing, which is the setting every claim about this chart has to be compared
# against.
keep: "4"

# Charged per expert pick a 16-token tile has already placed on a rank. 0 is the plain rule,
# which minimises dispatch volume alone and leaves the busiest rank holding more expert picks
# than default routing gives it. 8 is the paper's setting.
loadPenalty: "8"

# "1": the tail may come from any rank, picked by the load penalty alone (the paper's main
# setting). "0": only from ranks the head already visits.
anyRank: "1"

# Expert parallelism over data-parallel ranks with DeepEP: vLLM 0.31 builds its all-to-all
# kernels only with data parallelism, and without them there is no dispatch to balance. GPUs
# is the EP size, and the model's expert count must divide by it.
gpus: 4

extraArgs: []

hfTokenSecret: hf-token

resources:
  limits:
    cpu: "16"
    memory: 200Gi
  requests:
    cpu: "8"
    memory: 100Gi

service:
  port: 8000

nodeSelector: {}
tolerations: []
